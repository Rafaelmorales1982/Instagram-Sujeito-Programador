<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Projeto Instagram - Rafael M</title>
  </head>
  <body>
    <!--INICIO GLOBAL-->
    <div id="wrapper">
      <!--INICIO AREA CONTAINER-->
      <div id="container">
        <!--AREA ESQUERDA-->
        <div class="column left">
          <div class="main">

          </div>
        </div>
        <!--FIM AREA ESQUERDA-->

        <!--AREA DIREITA-->
        <div class="column right">
          <div class="login-painel">
            <div class="logo">
              <img src="./img/logo.png" alt="Logo sujeito" class="logo-img">
            </div>

            <form action="">
              <input type="text" name="username" placeholder="Telefone, usuário ou email">

              <input type="password" name="password" placeholder="Senha">

              <input type="submit" value="Entrar">
            </form>
          </div>

          <!--PARTE DO CADASTRE-SE-->
          <div class="infobox">
            <p>Não possui uma conta? <a href="#">
              cadastra-se
            </a></p>
          </div>
          <!--FIM PARTE DO CADASTRE-SE-->

          <div class="get-app-panel">
            Obtenha o aplicativo.

            <div class="app-buttons">
              <a href="#">
                <img src="./img/appstore.png" alt="Logo App">
              </a>

              <a href="#">
                <img src="./img/googleplay.png" alt="Logo App">
              </a>
            
            </div>
          </div>


        </div>
        <!--FIM AREA DIREITA-->
      </div>
      <!--FIM AREA CONTAINER-->

      <!--INICIO FOOTER-->
      <footer>
        <div class="footer-inner">
          <a href="#">About us</a>
          <a href="#">Suport</a>
          <a href="#">Blog</a>
          <a href="#">Press</a>
          <a href="#">API</a>
          <a href="#">Jobs</a>
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Profiles</a>
          <a href="#">Directory</a>
          <a href="#">Hashyags</a>
          <a href="#">Language</a>
          <div class="text-small">&copy; 2022 Instagram </div>
        </div>
      </footer>
      <!-- FIM FOOTER-->

    </div>
    <!--FIM GLOBAL-->


  </body>
</html>
